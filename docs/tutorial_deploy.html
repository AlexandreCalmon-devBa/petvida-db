<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutorial: Deploy na Nuvem (Aiven + Vercel) | SENAI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#F0F2F5}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pop{0%{transform:scale(0.96)}50%{transform:scale(1.02)}100%{transform:scale(1)}}
  button:hover{opacity:0.92;transform:translateY(-1px)} button:active{transform:translateY(0)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect}=React;
const C={dark:"#2E4059",darkH:"#3A5575",accent:"#3B82F6",green:"#059669",greenBg:"#ECFDF5",red:"#DC2626",redBg:"#FEF2F2",yellow:"#D97706",yellowBg:"#FEF3C7",white:"#FFF",g100:"#F8FAFC",g200:"#E2E8F0",g400:"#94A3B8",g600:"#475569",g800:"#1E293B",purple:"#7C3AED",purpleBg:"#F5F3FF",cyan:"#0891B2",orange:"#EA580C",codeBg:"#0D1117",codeText:"#C9D1D9"};
const TABS=["🚀 Visão Geral","⚙️ 1. API (Node)","🐬 2. Banco (Aiven)","☁️ 3. Nuvem (Vercel)","📝 4. Swagger (API Docs)","✅ Conclusão"];

function App(){
  const [tab,setTab]=useState(0);

  const btn=(v="primary",ex={})=>({padding:"10px 18px",border:"none",borderRadius:10,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit",transition:"all 0.15s",...(v==="primary"?{background:C.dark,color:C.white}:v==="green"?{background:C.green,color:C.white}:v==="accent"?{background:C.accent,color:C.white}:v==="purple"?{background:C.purple,color:C.white}:v==="orange"?{background:C.orange,color:C.white}:{background:C.g200,color:C.g600}),...ex});

  const Code=({code,title})=>(
    <div style={{background:C.codeBg,borderRadius:8,marginBottom:8,overflow:"hidden",border:"1px solid #30363D"}}>
      {title&&<div style={{padding:"5px 12px",borderBottom:"1px solid #30363D",background:"#161B22"}}><span style={{fontSize:10,color:"#8B949E",fontFamily:"monospace"}}>{title}</span></div>}
      <pre style={{padding:"10px 14px",fontSize:12,fontFamily:"'Cascadia Code',Consolas,monospace",lineHeight:1.6,color:C.codeText,margin:0,whiteSpace:"pre-wrap",overflow:"auto"}}>{code}</pre>
    </div>
  );

  return(
    <div style={{background:"#F0F2F5",minHeight:"100vh",padding:16,maxWidth:960,margin:"0 auto"}}>
      <div style={{background:`linear-gradient(135deg,${C.dark},${C.darkH})`,borderRadius:16,padding:"22px 28px",marginBottom:14,color:C.white,textAlign:"center"}}>
        <p style={{fontSize:11,textTransform:"uppercase",letterSpacing:2,opacity:0.7,marginBottom:4}}>Tutorial Passo a Passo</p>
        <h1 style={{fontSize:22,fontWeight:700}}>🚀 Deploy: Node.js + MySQL na Nuvem</h1>
        <p style={{fontSize:13,opacity:0.8}}>Aprenda a hospedar a API no Vercel e o Banco no Aiven gratuitamente</p>
      </div>

      <div style={{display:"flex",gap:4,marginBottom:14,background:C.white,borderRadius:12,padding:4,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",overflowX:"auto"}}>
        {TABS.map((t,i)=><button key={i} onClick={()=>setTab(i)} style={{flex:1,minWidth:120,padding:"10px 4px",border:"none",borderRadius:10,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",transition:"all 0.2s",background:tab===i?C.dark:"transparent",color:tab===i?C.white:C.g600}}>{t}</button>)}
      </div>

      <div style={{background:C.white,borderRadius:16,padding:22,boxShadow:"0 1px 4px rgba(0,0,0,0.06)",minHeight:400,animation:"fadeIn 0.3s"}} key={tab}>

        {/* ===== TAB 0: OVERVIEW ===== */}
        {tab===0&&(<div>
          <h2 style={{fontSize:19,color:C.g800,marginBottom:14}}>🚀 Por que precisamos de dois serviços?</h2>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}}>
            <div style={{border:`2px solid ${C.accent}`,borderRadius:12,overflow:"hidden"}}>
              <div style={{background:C.accent,padding:"10px 16px"}}><h3 style={{color:C.white,fontSize:15}}>☁️ VERCEL (Para a API)</h3></div>
              <div style={{padding:16}}>
                <p style={{fontSize:12,color:C.g600,lineHeight:1.7,marginBottom:10}}>O Vercel é excelente para rodar código (Node.js, React, HTML). Mas ele usa arquitetura Serverless (sem servidor fixo).</p>
                {[
                  "Roda o seu Javascript e o Swagger",
                  "Mata o servidor quando ninguém está acessando",
                  "NÃO PODE guardar arquivos locais (banco de dados .sqlite não funciona)",
                  "Não hospeda bancos relacionais nativamente"
                ].map((t,i)=><p key={i} style={{fontSize:11,color:C.g800,marginBottom:3,paddingLeft:8}}>• {t}</p>)}
              </div>
            </div>
            <div style={{border:`2px solid ${C.purple}`,borderRadius:12,overflow:"hidden"}}>
              <div style={{background:C.purple,padding:"10px 16px"}}><h3 style={{color:C.white,fontSize:15}}>🐬 AIVEN (Para o MySQL)</h3></div>
              <div style={{padding:16}}>
                <p style={{fontSize:12,color:C.g600,lineHeight:1.7,marginBottom:10}}>O Aiven hospeda bancos de dados reais. Ele é um computador na nuvem dedicado a guardar as suas tabelas de forma persistente.</p>
                {[
                  "Guarda suas tabelas, views e procedures",
                  "Sempre online, 24/7",
                  "Oferece MySQL de graça no plano Hobbyist",
                  "Conectamos a API do Vercel nele através de variáveis de ambiente"
                ].map((t,i)=><p key={i} style={{fontSize:11,color:C.g800,marginBottom:3,paddingLeft:8}}>• {t}</p>)}
              </div>
            </div>
          </div>

          <div style={{background:C.yellowBg,border:`1px solid #FCD34D`,borderRadius:10,padding:14,marginBottom:14}}>
            <p style={{fontSize:13,color:"#92400E",lineHeight:1.6}}><strong>💡 Resumo:</strong> Quando um usuário acessa seu link do Vercel, o Vercel "acorda" a sua API em Node. A API então se conecta ao Aiven remotamente, faz o `SELECT`, pega os dados e manda de volta para o usuário em formato JSON.</p>
          </div>

          <div style={{textAlign:"center",marginTop:8}}><button onClick={()=>setTab(1)} style={btn("accent")}>Passo 1: Preparar a API ⚙️ →</button></div>
        </div>)}

        {/* ===== TAB 1: API (NODE) ===== */}
        {tab===1&&(<div>
          <h2 style={{fontSize:19,color:C.g800,marginBottom:14}}>⚙️ Passo 1: Preparando seu projeto Node.js</h2>
          <p style={{fontSize:12,color:C.g600,marginBottom:14}}>Antes de subir, seu código precisa estar preparado para rodar no Vercel e exigir conexão segura (SSL) no banco de dados.</p>

          {[
            {icon:"📄",title:"1. Crie o arquivo vercel.json",text:"Crie este arquivo na raiz do seu projeto. Ele diz ao Vercel onde está o seu servidor principal para fazer o roteamento correto.",color:C.accent,
              code:`{\n  "version": 2,\n  "builds": [\n    { "src": "src/server.js", "use": "@vercel/node" }\n  ],\n  "routes": [\n    { "src": "/(.*)", "dest": "/src/server.js" }\n  ]\n}`},
            {icon:"🔒",title:"2. Force o SSL na conexão do Banco",text:"O Aiven não permite conexões inseguras. Altere a configuração de criação do Pool (ex: database.js) para aceitar SSL.",color:C.green,
              code:`const pool = mysql.createPool({\n  host: process.env.DB_HOST,\n  user: process.env.DB_USER,\n  password: process.env.DB_PASSWORD,\n  database: process.env.DB_NAME,\n  // Esta linha é crucial para o Aiven funcionar no Vercel:\n  ssl: process.env.VERCEL ? { rejectUnauthorized: false } : undefined\n});`},
            {icon:"🌍",title:"3. Não dê app.listen() no Vercel",text:"No Vercel, ele mesmo gerencia a porta. Você deve exportar o app no final, e só dar listen se estiver local.",color:C.purple,
              code:`// Final do seu server.js:\nif (process.env.NODE_ENV !== 'production' && !process.env.VERCEL) {\n  app.listen(3000, () => {\n    console.log('Rodando localmente');\n  });\n}\nmodule.exports = app;`},
          ].map((card,i)=>(
            <div key={i} style={{marginBottom:14,background:C.g100,borderRadius:12,padding:16,borderLeft:`4px solid ${card.color}`,animation:"fadeIn 0.3s",animationDelay:i*0.1+"s",animationFillMode:"both"}}>
              <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:18}}>{card.icon}</span>
                <h3 style={{fontSize:14,fontWeight:700,color:C.g800}}>{card.title}</h3>
              </div>
              <p style={{fontSize:12,color:C.g600,lineHeight:1.6,marginBottom:8}}>{card.text}</p>
              <Code code={card.code}/>
            </div>
          ))}

          <div style={{textAlign:"center",marginTop:14}}><button onClick={()=>setTab(2)} style={btn("green")}>Passo 2: Criar Banco no Aiven 🐬 →</button></div>
        </div>)}

        {/* ===== TAB 2: AIVEN ===== */}
        {tab===2&&(<div>
          <h2 style={{fontSize:19,color:C.g800,marginBottom:14}}>🐬 Passo 2: Criando o MySQL Grátis no Aiven</h2>
          
          <div style={{background:C.redBg,borderRadius:10,padding:14,border:"1px solid #FCA5A5",marginBottom:16}}>
            <p style={{fontSize:13,color:C.red,fontWeight:600,marginBottom:4}}>⚠️ ALERTA DE ERRO COMUM:</p>
            <p style={{fontSize:12,color:"#991B1B",lineHeight:1.6}}>Ao criar um serviço no Aiven, a primeira opção pré-selecionada que aparece é o <strong>Kafka</strong> ou <strong>PostgreSQL</strong>. <strong>NÃO CRIE ELES!</strong> Role a tela um pouco para baixo e clique exatamente no ícone do Golfinho 🐬 (<strong>MySQL</strong>).</p>
          </div>

          <div style={{paddingLeft:16}}>
            {[
              "Acesse Aiven.io e crie conta via GitHub ou Google.",
              "Clique no botão azul 'Create Service'.",
              "Selecione 'MySQL' (o golfinho).",
              "Em Service Plan, role a página até o final e selecione a aba 'Free / Hobbyist (0$)'.",
              "Escolha a região da nuvem (AWS - South America / São Paulo) para ficar mais rápido no Brasil.",
              "Clique em Create. Aguarde ~2 minutos até a bolinha ficar VERDE (Running)."
            ].map((text,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:12,alignItems:"center"}}>
              <div style={{width:24,height:24,borderRadius:12,background:C.dark,color:C.white,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</div>
              <p style={{fontSize:13,color:C.g800}}>{text}</p>
            </div>)}
          </div>

          <h3 style={{fontSize:15,color:C.g800,marginTop:20,marginBottom:10}}>Pescando suas chaves</h3>
          <p style={{fontSize:12,color:C.g600,marginBottom:10}}>Na aba <strong>Overview</strong>, encontre a seção "Connection Information". Você vai precisar desses 4 itens para colar no Vercel (e no DBeaver):</p>
          
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {["Host (URL gigante)","Port (ex: 14100)","User (avnadmin)","Password (Clique no 👁️)"].map((k,i)=>(
              <div style={{background:C.white,border:`1px solid ${C.g200}`,borderRadius:8,padding:10,textAlign:"center",fontWeight:700,fontSize:11,color:C.accent,boxShadow:"0 1px 2px rgba(0,0,0,0.05)"}} key={i}>{k}</div>
            ))}
          </div>

          <div style={{background:C.purpleBg,borderRadius:10,padding:14,border:"1px solid #C4B5FD",marginBottom:16}}>
            <p style={{fontSize:13,color:C.purple,fontWeight:600,marginBottom:4}}>Injetando suas tabelas:</p>
            <p style={{fontSize:12,color:"#4C1D95",lineHeight:1.6}}>Seu banco nasce completamente vazio. Abra o <strong>DBeaver</strong> ou Workbench, crie uma conexão pegando esses dados acima. Na aba <strong>SSL</strong>, marque "Require SSL". Conecte e execute seu <code>schema.sql</code>, <code>seed.sql</code>, views e procedures para povoar o banco na nuvem.</p>
          </div>

          <div style={{textAlign:"center",marginTop:14}}><button onClick={()=>setTab(3)} style={btn("purple")}>Passo 3: Ligar a Nuvem ☁️ →</button></div>
        </div>)}

        {/* ===== TAB 3: VERCEL ===== */}
        {tab===3&&(<div>
          <h2 style={{fontSize:19,color:C.g800,marginBottom:14}}>☁️ Passo 3: Deploy da API no Vercel</h2>
          
          <div style={{paddingLeft:16,marginBottom:16}}>
            {[
              "No seu computador, dê 'git push' de todo o seu código para o seu repositório no GitHub.",
              "Acesse Vercel.com e faça login com a conta do GitHub.",
              "Clique no botão 'Add New...' e escolha 'Project'.",
              "Encontre seu repositório do projeto na lista e clique em 'Import'."
            ].map((text,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:12,alignItems:"center"}}>
              <div style={{width:24,height:24,borderRadius:12,background:C.purple,color:C.white,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</div>
              <p style={{fontSize:13,color:C.g800}}>{text}</p>
            </div>)}
          </div>

          <div style={{background:C.yellowBg,borderRadius:10,padding:14,border:"1px solid #FCD34D",marginBottom:16}}>
            <p style={{fontSize:13,color:"#92400E",fontWeight:700,marginBottom:4}}>⚠️ A PEÇA CHAVE: Variáveis de Ambiente</p>
            <p style={{fontSize:12,color:"#92400E",lineHeight:1.6}}>Antes de clicar no botão final Deploy, você precisa ensinar o Vercel a se comunicar com o Aiven. Abra a sanfoninha chamada <strong>Environment Variables</strong> e insira os dados do Aiven um por um clicando em 'Add':</p>
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
             {[
               {k:"DB_HOST",v:"mysql-xyz-suaorg.aivencloud.com"},
               {k:"DB_PORT",v:"14100 (Sua porta copiada do Aiven)"},
               {k:"DB_USER",v:"avnadmin"},
               {k:"DB_PASSWORD",v:"Sua Senha Gigante Secreta"},
               {k:"DB_NAME",v:"petvida (ou defaultdb)"},
             ].map((env,i)=>(
               <div key={i} style={{display:"flex",border:`1px solid ${C.g200}`,borderRadius:6,overflow:"hidden"}}>
                  <div style={{width:120,background:C.g100,padding:8,fontSize:11,fontWeight:700,color:C.g800,borderRight:`1px solid ${C.g200}`}}>{env.k}</div>
                  <div style={{flex:1,padding:8,fontSize:11,color:C.accent,fontFamily:"monospace"}}>{env.v}</div>
               </div>
             ))}
          </div>
          
          <div style={{textAlign:"center"}}>
            <p style={{fontSize:12,color:C.g600,marginBottom:14}}>Depois de adicionar e salvar as 5 variáveis, clique no botão azul gigante <strong>Deploy</strong> e aguarde a mágica! 🪄</p>
            <button onClick={()=>setTab(4)} style={btn("primary")}>Ver como criar o Swagger 📝 →</button>
          </div>
        </div>)}

        {/* ===== TAB 4: SWAGGER BONUS ===== */}
        {tab===4&&(<div>
          <h2 style={{fontSize:19,color:C.g800,marginBottom:14}}>📝 4. Swagger: Como criar a página de Documentação API</h2>
          
          <p style={{fontSize:12,color:C.g600,marginBottom:10}}>Você pode criar uma interface de testes visual incrível (igual do projeto PetVida) para suas próprias APIs em 3 passos:</p>

          <div style={{background:C.greenBg,borderRadius:10,padding:14,border:"1px solid #6EE7B7",marginBottom:16}}>
            <p style={{fontSize:13,color:C.green,fontWeight:600,marginBottom:4}}>Passo A: Instalar a biblioteca</p>
            <p style={{fontSize:12,color:"#065F46",lineHeight:1.6}}>No terminal do seu projeto, instale o pacote <code>swagger-ui-express</code>:</p>
            <Code code="npm install swagger-ui-express" title="Terminal" />
          </div>

          <div style={{background:C.g100,borderRadius:10,padding:14,border:`1px solid ${C.g200}`,marginBottom:16}}>
            <p style={{fontSize:13,color:C.g800,fontWeight:600,marginBottom:4}}>Passo B: Criar o arquivo de definições</p>
            <p style={{fontSize:12,color:C.g600,lineHeight:1.6,marginBottom:6}}>Crie um arquivo chamado <code>swagger.json</code>. A opção <strong>"url": "/"</strong> é crucial para não dar erro de CORS no Vercel.</p>
            <Code code={`{
  "openapi": "3.0.0",
  "info": {
    "title": "Minha API Incrível",
    "version": "1.0.0"
  },
  "servers": [ { "url": "/" } ],
  "paths": {
    "/minha-rota": {
      "get": {
        "summary": "Busca dados de teste",
        "responses": { "200": { "description": "Sucesso!" } }
      }
    }
  }
}`} title="swagger.json" />
          </div>

          <div style={{background:C.purpleBg,borderRadius:10,padding:14,border:"1px solid #C4B5FD",marginBottom:16}}>
            <p style={{fontSize:13,color:C.purple,fontWeight:600,marginBottom:4}}>Passo C: Injetar a rota na API e arrumar pro Vercel</p>
            <p style={{fontSize:12,color:"#4C1D95",lineHeight:1.6,marginBottom:6}}>No seu <code>app.js</code>, configure a rota <code>/api-docs</code> usando a CDN para evitar o famoso erro de <code>Unexpected token '&lt;'</code> do Vercel:</p>
            <Code code={`const express = require('express');
const app = express();
const swaggerUi = require('swagger-ui-express');
const swaggerDocument = require('./swagger.json');

// 1. Usar links de CDN (Cloudflare) para evitar erro no Vercel
const CSS_URL = "https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.1.0/swagger-ui.min.css";
const JS_URL = "https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.1.0/swagger-ui-bundle.min.js";
const JS_URL2 = "https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/4.1.0/swagger-ui-standalone-preset.min.js";

const swaggerOptions = { customCssUrl: CSS_URL, customJs: [JS_URL, JS_URL2] };

// 2. Subir a rota!
app.use('/api-docs', swaggerUi.serve, swaggerUi.setup(swaggerDocument, swaggerOptions));`} title="app.js" />
          </div>

          <div style={{textAlign:"center",marginTop:14}}>
            <button onClick={()=>setTab(5)} style={btn("green")}>Concluir Tutorial ✅ →</button>
          </div>
        </div>)}

        {/* ===== TAB 5: SUMMARY ===== */}
        {tab===5&&(<div>
          <div style={{textAlign:"center",padding:24,background:C.greenBg,borderRadius:12,animation:"pop 0.3s",marginBottom:20}}>
            <p style={{fontSize:50,marginBottom:8}}>🎉</p>
            <h2 style={{fontSize:22,fontWeight:700,color:C.green,marginBottom:10}}>Tudo Online!</h2>
            <p style={{fontSize:13,color:"#065F46"}}>Seu banco de dados, API e Documentação Swagger estão rodando perfeitamente conectados na nuvem.</p>
          </div>

          <h3 style={{fontSize:16,color:C.g800,marginBottom:10}}>Checklist Final:</h3>
          <div style={{background:C.white,border:`1px solid ${C.g200}`,borderRadius:12,padding:16}}>
             {[
               "Acesse o link gerado pelo Vercel (ex: meu-projeto.vercel.app)",
               "Adicione /api-docs ao final da URL para abrir o Swagger.",
               "Teste um endpoint (ex: GET /api/veterinarios) clicando no botão Execute.",
               "Veja os dados reais retornando do Aiven! A mágica aconteceu.",
               "Mande o link no grupo do WhatsApp para os amigos testarem."
             ].map((text,i)=><p key={i} style={{fontSize:13,color:C.g800,marginBottom:8}}>✅ {text}</p>)}
          </div>
          
          <div style={{textAlign:"center",marginTop:24}}>
             <p style={{fontSize:11,color:C.g400}}>Produzido para o SENAI • Tutorial de Hospedagem Node + MySQL</p>
          </div>
        </div>)}

      </div>
      <div style={{textAlign:"center",padding:"14px 0",fontSize:11,color:C.g400}}>Deploy na Nuvem (Vercel + Aiven) | Documentação Interativa</div>
    </div>
  );
}
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
